.hero{background:linear-gradient(135deg,#0b1f36,#16365c);color:#fff;padding:22px 0 26px;border-bottom:3px solid var(--gold)}
.hero .kick{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:#cbd5e1;font-weight:700}
.hero h2{font-size:clamp(1.5rem,3.6vw,2.3rem);font-weight:800;margin:4px 0 4px;letter-spacing:-.01em}
.hero .lead{font-size:.95rem;color:#e2e8f0;max-width:820px}
.hero .asof{font-size:.74rem;color:#94a3b8;margin-top:6px;line-height:1.45}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.stat{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:12px 14px}
.stat .l{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:#cbd5e1;font-weight:700}
.stat .n{font:800 1.6rem 'JetBrains Mono',monospace;margin:2px 0}
.stat .s{font-size:.78rem;color:#e2e8f0;line-height:1.4}

.ac .t2{font-size:.78rem;color:var(--mut)}
.ac .big{font:800 1.9rem 'JetBrains Mono',monospace;color:var(--ink);margin:4px 0 0}
.ac .sub{font-size:.8rem;color:var(--mut)}

.ac .row{display:flex;justify-content:space-between;font-size:.8rem;margin-top:4px}

.leader{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;background:#fff;border:1px solid var(--line)}
.leader .ph{width:44px;height:44px;border-radius:50%;object-fit:cover;object-position:top center;border:2px solid var(--gold);background:#e2e8f0;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:.95rem}
.leader h4{font-size:.82rem;font-weight:700;color:var(--navy)}.leader p{font-size:.7rem;color:var(--mut)}
.pt{display:inline-block;font-size:.64rem;font-weight:800;padding:1px 6px;border-radius:3px;margin-top:2px}
/* tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 14px;border-bottom:2px solid var(--line);padding-bottom:0}
.tabs button{border:0;background:transparent;padding:10px 16px;font-size:.9rem;font-weight:800;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--navy);border-bottom-color:var(--gold)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools input,.tools select{padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:.85rem;background:#fff;min-width:150px}
.tools input{flex:1;min-width:200px;max-width:360px}
.note{background:#f8fafc;border:1px dashed var(--line);border-radius:8px;padding:10px 12px;font-size:.8rem;color:#475569;line-height:1.5;margin-bottom:12px}

.cc{background:#fff;border:1px solid var(--line);border-left:5px solid var(--pc,var(--pend));border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:9px;box-shadow:0 1px 3px rgba(0,0,0,.05)}

      h += '<div class="wgrid">' + g + '</div>';
      const show = SELW != null ? ws.filter(w => w.no === SELW) : ws.filter(w => w.candidates.length);
      h += show.map(w => '<div class="wcard"><h5><span>' + esc(t('division')) + ' ' + w.no + '</span><span>' + esc(w.status) + (w.margin != null ? ' · ' + esc(t('margin')) + ' ' + fmt(w.margin) : '') + '</span></h5>' + (w.candidates.length ? w.candidates.slice().sort((a, c) => (c.votes || 0) - (a.votes || 0)).map(c => candRow(c, c.status === 'WON')).join('') : '<div class="note" style="margin:8px">' + esc(t('noCands')) + '</div>') + '</div>').join('') || '<div class="note">' + esc(t('noCands')) + '</div>';
    }
  }
  $('#mbox').innerHTML = h + '</div>';
}

/* ---------- map (Leaflet, optional) ---------- */
function pinColor(b) { const v = view(b), al = v.lead || headAlliance(b); return al ? ALL[al].c : '#94a3b8'; }
function ensureMap() {
  if (typeof L === 'undefined' || !$('#map')) return;
  if (map) { map.remove(); map = null; pins = null; }
  map = L.map('map', {center:[15.9, 80.4], zoom:6.5, zoomSnap:.25, minZoom:6, maxZoom:12});
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {attribution:'&copy; OpenStreetMap &copy; CARTO', subdomains:'abcd', maxZoom:19}).addTo(map);
  pins = L.layerGroup().addTo(map);
  CORPS.forEach(b => {
    const v = view(b), has = v.has, html = '<div class="pin" style="--pc:' + pinColor(b) + '"><i></i><span>' + esc(bn(b).replace(/ \(.*\)/, '')) + '</span><b>' + (has ? v.nda + '/' + v.counted : '—') + '</b></div>';
    L.marker([b.lat, b.lng], {icon:L.divIcon({html:html, className:'', iconSize:[0, 0]})}).on('click', () => openBody(b.id)).addTo(pins);
  });
}

/* ---------- events (delegated; feed text is never put in handlers) ---------- */
document.addEventListener('click', e => {
  const tg = e.target.closest ? e.target : null; if (!tg) return;
  const tab = tg.closest('[data-tab]'); if (tab) { TAB = tab.dataset.tab; renderTabs(); renderView(); return; }
  const op = tg.closest('[data-open]'); if (op) { openBody(op.dataset.open); return; }
  if (tg.closest('[data-close]') || tg.id === 'modal') { closeModal(); return; }
  const mt = tg.closest('[data-mtab]'); if (mt) { MTAB = mt.dataset.mtab; renderModal(); return; }
  const wd = tg.closest('[data-ward]'); if (wd) { const n = +wd.dataset.ward; SELW = SELW === n ? null : n; renderModal(); return; }
});
document.addEventListener('input', e => { if (e.target.id === 'qMuni') { Q.muni = e.target.value; renderView(); } if (e.target.id === 'qCand') { Q.cand = e.target.value; renderView(); } });
document.addEventListener('change', e => { if (e.target.id === 'selDist') { Q.dist = e.target.value; renderView(); } if (e.target.id === 'selKind') { Q.kind = e.target.value; renderView(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && MODAL) closeModal(); });
function setLang(l) { LANG = l; document.documentElement.lang = l === 'te' ? 'te' : 'en'; $('#lEn').classList.toggle('on', l === 'en'); $('#lTe').classList.toggle('on', l === 'te'); renderAll(); }
$('#lEn').onclick = () => setLang('en'); $('#lTe').onclick = () => setLang('te');

/* ---------- leaders strip (photos from Wikipedia; initials fallback) ---------- */
const LEADERS = [
  {w:'N._Chandrababu_Naidu', n:'N. Chandrababu Naidu', r:'Chief Minister · TDP', bg:'#fef08a', fg:'#854d0e'},
  {w:'Pawan_Kalyan', n:'Pawan Kalyan', r:'Deputy Chief Minister · JSP', bg:'#fee2e2', fg:'#991b1b'},
  {w:'Y._S._Jagan_Mohan_Reddy', n:'Y. S. Jagan Mohan Reddy', r:'YSRCP president', bg:'#dbeafe', fg:'#1e40af'},
  {w:'Daggubati_Purandeswari', n:'D. Purandeswari', r:'BJP leader', bg:'#ffedd5', fg:'#9a3412'}
];
function initLeaders() {
  $('#leaders').innerHTML = LEADERS.map((l, i) => '<div class="leader"><div class="ph" id="ph' + i + '" style="background:' + l.fg + '">' + esc(initials(l.n.split(' ').slice(-1)[0])) + '</div><div><h4>' + esc(l.n) + '</h4><p>' + esc(l.r) + '</p></div></div>').join('');
  LEADERS.forEach((l, i) => {
    if (typeof fetch !== 'function') return;
    fetch('https://en.wikipedia.org/api/rest_v1/page/summary/' + l.w).then(r => r.ok ? r.json() : null).then(d => {
      const u = d && ((d.thumbnail && d.thumbnail.source) || (d.originalimage && d.originalimage.source)); if (!u || !/^https:\/\//.test(u)) return;
      const old = $('#ph' + i); if (!old) return; const img = document.createElement('img'); img.className = 'ph'; img.alt = l.n; img.referrerPolicy = 'no-referrer'; img.src = u; img.onload = () => old.replaceWith(img);
    }).catch(() => {});
  });
}

/* ---------- live feed ---------- */
async function loadFeed() {
  let got = null;
  for (const u of FEEDS) {
    try {
      const ctl = typeof AbortController === 'function' ? new AbortController() : null, to = setTimeout(() => ctl && ctl.abort(), 12000);
      const r = await fetch(u + (u.indexOf('?') >= 0 ? '&' : '?') + 't=' + Date.now(), {cache:'no-store', signal:ctl ? ctl.signal : undefined}); clearTimeout(to);
      if (!r.ok) continue; const c = clean(await r.json()); if (c) { got = c; break; }
    } catch (e) { /* try next source */ }
  }
  lastCheck = Date.now();
  if (got) { feedOk = true; const sig = JSON.stringify(got); if (sig !== lastSig) { lastSig = sig; DATA = got; renderAll(); } else renderStatus(); }
  else { feedOk = false; renderStatus(); }
  return !!got;
}
let timer = null;
function startPolling() { if (timer) clearInterval(timer); timer = setInterval(() => { if (!document.hidden) loadFeed(); }, POLL_MS); }
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadFeed(); });
$('#refreshBtn').onclick = () => { const b = $('#refreshBtn'); b.disabled = true; loadFeed().then(() => { b.disabled = false; }); };
setInterval(renderStatus, 15000);

function renderAll() { renderHero(); renderStatus(); renderTabs(); renderView(); if (MODAL) renderModal(); }
initLeaders(); renderAll(); loadFeed(); startPolling();
</script>
